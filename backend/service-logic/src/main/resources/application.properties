application.security.supabase.algorithm                 =HmacSHA256
application.security.supabase.secret                    =<token>

application.security.ratelimit.graphql.tokens_per_second=25

spring.datasource.url                                   =jdbc:postgresql://localhost:5432/postgres
spring.datasource.username                              =postgres
spring.datasource.password                              =test
spring.jpa.properties.hibernate.format_sql              =true
spring.jpa.show-sql                                     =false
spring.jpa.properties.hibernate.default_schema          =devdojo
spring.flyway.schemas                                   =devdojo

spring.data.redis.database                              =0
spring.data.redis.host                                  =localhost
spring.data.redis.port                                  =6379
spring.data.redis.password                              =redispw
spring.data.redis.timeout                               =60000

spring.rabbitmq.host                                    =localhost
spring.rabbitmq.port                                    =5672
spring.rabbitmq.username                                =user
spring.rabbitmq.password                                =password
spring.rabbitmq.virtual-host                            =icarus
spring.rabbitmq.listener.simple.acknowledge-mode        =auto
spring.rabbitmq.listener.simple.concurrency             =3
spring.rabbitmq.listener.simple.max-concurrency         =10
spring.rabbitmq.listener.simple.prefetch                =1
spring.rabbitmq.listener.simple.retry.enabled           =true
spring.rabbitmq.listener.simple.retry.max-attempts      =3
spring.rabbitmq.listener.simple.retry.initial-interval  =1000
spring.rabbitmq.listener.simple.retry.multiplier        =2.0
spring.rabbitmq.listener.simple.retry.max-interval      =10000
spring.rabbitmq.template.reply-timeout                  =5000
